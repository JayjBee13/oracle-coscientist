name: CI

# Nothing here calls a model. The engine is exercised through its fake runner, so the whole
# pipeline is free and deterministic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The application asserts both the database name and the role it connects as, so the
  # service below is created with exactly those. The suite then builds a throwaway schema
  # per session and never touches `public`.
  DATABASE_URL: postgresql+psycopg://ai_coscientist_gui_app:changeme@127.0.0.1:5432/ai_coscientist_gui

jobs:
  backend:
    name: backend (ruff, migrations, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_coscientist_gui_app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: ai_coscientist_gui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_coscientist_gui_app -d ai_coscientist_gui"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Migrate
        working-directory: backend
        run: alembic upgrade head

      - name: Test
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: frontend (lint, types, tests, build, API contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # The OpenAPI emitter runs the backend through its own virtualenv — the same
      # resolution `npm run gen:api` uses locally, which is why the venv has to exist here.
      - name: Install backend for the API contract check
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -e backend

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

      # Fails if src/api/schema.ts or openapi.json would change: the API contract is
      # generated, never hand-written.
      - name: API contract is up to date
        working-directory: frontend
        run: npm run gen:api:check

  archive:
    name: archive integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The archived original engines are hashed in MANIFEST.sha256 and a unit test diffs
      # today's role prompts against them. Re-hash the lot on every push.
      - name: Verify
        run: python scripts/archive_data.py verify
